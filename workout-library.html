<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Library">
<meta name="theme-color" content="#faf9f6">
<title>Workout Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf9f6;--surface:#fff;--surface2:#f3f1ec;--line:#ece9e2;--line2:#e0ddd4;
  --ink:#1c1b18;--muted:#9b968c;--muted2:#6f6b62;--accent:#5f7d6b;--accent-soft:#eef2ee;
  --warn:#b5653f;--work:#b5653f;--rest:#5f7d6b;
  --safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:5px;}
@media (prefers-reduced-motion:reduce){*{transition-duration:.001ms!important;animation-duration:.001ms!important;}}
html,body{height:100%;}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:400;-webkit-font-smoothing:antialiased;font-feature-settings:'tnum';overflow-x:hidden;}

.hd{padding:calc(var(--safe-top) + 22px) 22px 6px;display:flex;align-items:baseline;gap:10px;}
.hd-title{font-size:19px;font-weight:600;letter-spacing:-0.3px;}
.hd-sub{font-size:12px;color:var(--muted);}
.appsw{margin-left:auto;display:flex;gap:5px;}
.appsw a{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:11px;background:var(--surface2);transition:opacity .15s;text-decoration:none;}
.appsw a:active{opacity:.5;}
.appsw a svg{width:18px;height:18px;stroke:var(--muted2);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.appsw a.cur{background:var(--ink);}
.appsw a.cur svg{stroke:#faf9f6;}

/* top view split */
.viewseg{display:flex;gap:8px;padding:14px 22px 2px;}
.viewseg button{flex:1;border:1px solid var(--line2);background:none;color:var(--muted2);font-family:var(--font);font-size:14px;font-weight:600;padding:11px 6px;border-radius:13px;cursor:pointer;transition:all .15s;}
.viewseg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);}

/* chips */
.chips{display:flex;gap:8px;padding:12px 22px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;border:1px solid var(--line2);background:none;color:var(--muted2);font-family:var(--font);font-size:13px;font-weight:500;padding:8px 15px;border-radius:20px;cursor:pointer;transition:all .15s;}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink);}

/* cards */
.list{padding:8px 18px calc(var(--safe-bot) + 30px);}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:17px 18px;margin-bottom:12px;cursor:pointer;transition:transform .1s;}
.card:active{transform:scale(.99);}
.card-top{display:flex;align-items:flex-start;gap:10px;}
.card-name{font-size:16px;font-weight:600;letter-spacing:-0.3px;flex:1;}
.card-badge{font-size:10px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;padding:3px 8px;border-radius:8px;background:var(--surface2);color:var(--muted2);white-space:nowrap;}
.card-badge.prog{background:var(--accent-soft);color:var(--accent);}
.card-sum{font-size:13px;color:var(--muted2);line-height:1.5;margin-top:7px;}
.card-meta{font-size:11px;color:var(--muted);margin-top:10px;display:flex;gap:12px;}
.card-meta b{font-weight:500;color:var(--muted2);}
.card-badge.cur{background:var(--accent);color:#fff;}
.run-banner{background:var(--accent);color:#fff;font-size:12px;font-weight:500;padding:9px 13px;border-radius:11px;margin-bottom:14px;letter-spacing:.2px;}

/* current program panel */
.cur-empty{font-size:13px;color:var(--muted);line-height:1.6;text-align:center;padding:22px 24px 18px;}
.cur-empty b{color:var(--muted2);font-weight:600;}
.cur-choose{display:flex;gap:8px;margin-top:12px;}
.cur-choose .btn{padding:11px;}
.cur-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 18px;margin-bottom:12px;}
.cur-badge{font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--accent);margin-bottom:8px;}
.cur-name{font-size:21px;font-weight:600;letter-spacing:-0.4px;}
.cur-src{font-size:12px;color:var(--muted);margin-top:3px;}
.cur-stats{display:flex;gap:10px;margin:18px 0 14px;}
.cur-cell{flex:1;background:var(--surface2);border-radius:13px;padding:13px 8px;text-align:center;}
.cur-val{font-size:26px;font-weight:300;letter-spacing:-1px;line-height:1;}
.cur-lbl{font-size:10px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);font-weight:500;margin-top:6px;}
.cur-prog{font-size:12.5px;color:var(--accent);background:var(--accent-soft);border-radius:12px;padding:11px 13px;margin-bottom:14px;line-height:1.5;}
.cur-actions{display:flex;gap:8px;justify-content:center;padding:4px 0 8px;}
.cur-link{flex:1;background:none;border:1px solid var(--line2);color:var(--muted2);font-family:var(--font);font-size:13px;font-weight:500;padding:11px;border-radius:12px;cursor:pointer;}
.cur-link.warn:active{color:var(--warn);border-color:var(--warn);}

/* sheet (detail / runner) */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:200;display:none;flex-direction:column;}
.sheet.on{display:flex;}
.sheet-hd{padding:calc(var(--safe-top) + 16px) 20px 14px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);flex-shrink:0;}
.x{background:none;border:none;cursor:pointer;padding:4px;display:flex;}
.x svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;}
.sheet-title{font-size:16px;font-weight:600;letter-spacing:-0.3px;flex:1;min-width:0;}
.sheet-title small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:2px;}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 20px calc(var(--safe-bot) + 110px);}
.sheet-foot{position:absolute;bottom:0;left:0;right:0;padding:14px 20px calc(var(--safe-bot) + 16px);background:linear-gradient(transparent,var(--bg) 26%);}

.note{font-size:13px;color:var(--muted2);line-height:1.65;background:var(--surface2);border-radius:14px;padding:14px 15px;margin-bottom:18px;}
.sec{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:500;margin:4px 0 12px;}

/* item rows */
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-bottom:10px;}
.item.done{border-color:var(--accent);background:var(--accent-soft);}
.item-row{display:flex;align-items:flex-start;gap:12px;}
.chk{width:24px;height:24px;border-radius:50%;border:1.8px solid var(--line2);flex-shrink:0;margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.item.done .chk{background:var(--accent);border-color:var(--accent);}
.chk svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:0;}
.item.done .chk svg{opacity:1;}
.item-main{flex:1;min-width:0;}
.item-name{font-size:15px;font-weight:500;letter-spacing:-0.2px;}
.item-note{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:4px;}
.item-scheme{font-size:15px;font-weight:300;color:var(--accent);white-space:nowrap;}
.item-log{margin-top:11px;display:flex;gap:8px;align-items:center;}
.mini{width:100%;background:var(--surface2);border:1px solid transparent;border-radius:10px;color:var(--ink);font-family:var(--font);font-size:15px;text-align:center;padding:9px 6px;outline:none;}
.mini:focus{border-color:var(--accent);background:#fff;}
.logbtn{background:var(--ink);color:var(--bg);border:none;border-radius:10px;font-family:var(--font);font-size:12px;font-weight:600;padding:10px 14px;cursor:pointer;white-space:nowrap;}
.logtoggle{background:none;border:1px solid var(--line2);border-radius:9px;color:var(--muted2);font-family:var(--font);font-size:11px;font-weight:500;padding:7px 11px;cursor:pointer;margin-top:10px;}
.logtoggle:active{border-color:var(--accent);color:var(--accent);}

/* program controls */
.seg{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.seg button{flex:1;min-width:60px;border:1px solid var(--line2);background:none;color:var(--muted2);font-family:var(--font);font-size:13px;font-weight:500;padding:9px 6px;border-radius:11px;cursor:pointer;}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.setrow{display:flex;align-items:center;gap:12px;padding:13px 15px;background:var(--surface);border:1px solid var(--line);border-radius:13px;margin-bottom:9px;}
.setrow.amrap{border-color:var(--accent);}
.set-pct{font-size:11px;color:var(--muted);width:42px;font-weight:500;}
.set-reps{flex:1;font-size:14px;font-weight:500;}
.set-reps small{color:var(--muted);font-weight:400;}
.set-wt{font-size:22px;font-weight:300;letter-spacing:-0.5px;}
.set-wt small{font-size:12px;color:var(--muted);}
.tm-warn{background:var(--accent-soft);color:var(--accent);font-size:12.5px;line-height:1.6;padding:14px 15px;border-radius:13px;margin-bottom:14px;}

/* warmup block */
.warm{background:var(--surface);border:1px dashed var(--line2);border-radius:14px;margin-bottom:18px;overflow:hidden;}
.warm-hd{display:flex;align-items:center;gap:10px;padding:13px 15px;cursor:pointer;}
.warm-hd .wt{font-size:13px;font-weight:600;letter-spacing:-0.1px;flex:1;}
.warm-hd .wt small{color:var(--muted);font-weight:400;}
.warm-chev{color:var(--muted);transition:transform .25s;}
.warm-chev svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;}
.warm.open .warm-chev{transform:rotate(180deg);}
.warm-body{display:none;border-top:1px solid var(--line);padding:4px 0;}
.warm.open .warm-body{display:block;}
.wrow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:10px 15px;}
.wrow-name{font-size:13px;font-weight:500;}
.wrow-note{font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:2px;}
.wrow-scheme{font-size:13px;color:var(--accent);white-space:nowrap;flex-shrink:0;}

/* weekly program day cards */
.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;}
.day-hd{display:flex;align-items:center;gap:10px;padding:14px 15px;cursor:pointer;}
.day-title{font-size:14px;font-weight:600;letter-spacing:-0.2px;flex:1;}
.day-focus{font-size:11px;color:var(--muted);margin-top:2px;font-weight:400;}
.day-dur{font-size:11px;color:var(--muted);white-space:nowrap;}
.day-chev{color:var(--muted);transition:transform .25s;}
.day-chev svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;}
.day.open .day-chev{transform:rotate(180deg);}
.day-body{display:none;border-top:1px solid var(--line);}
.day.open .day-body{display:block;}

/* easy-strength slot pickers */
.es-note{font-size:12.5px;color:var(--muted2);line-height:1.6;background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin-bottom:14px;}
.es-slot{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);}
.es-slot-lbl{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:500;width:62px;flex-shrink:0;}
.es-sel{flex:1;background:var(--surface2);border:1px solid transparent;border-radius:10px;color:var(--ink);font-family:var(--font);font-size:14px;font-weight:500;padding:10px 12px;outline:none;-webkit-appearance:none;appearance:none;cursor:pointer;}
.es-sel:focus{border-color:var(--accent);background:#fff;}

/* challenge progress */
.chal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px;}
.chal-top{display:flex;align-items:baseline;gap:10px;}
.chal-big{font-size:34px;font-weight:300;letter-spacing:-1.5px;line-height:1;}
.chal-big small{font-size:16px;color:var(--muted);font-weight:400;letter-spacing:0;}
.chal-cap{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:500;margin-left:auto;}
.chal-bar{height:7px;background:var(--surface2);border-radius:4px;margin-top:14px;overflow:hidden;}
.chal-bar span{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s;}
.chal-sub{font-size:12px;color:var(--muted);margin-top:9px;}

/* buttons */
.btn{width:100%;padding:16px;border-radius:14px;border:none;font-family:var(--font);font-size:15px;font-weight:600;cursor:pointer;transition:transform .1s;box-shadow:0 4px 18px rgba(28,27,24,0.10);}
.btn:active{transform:scale(.99);}
.btn-pri{background:var(--ink);color:var(--bg);}

/* TIMER */
.timer{position:fixed;inset:0;z-index:300;display:none;flex-direction:column;align-items:center;justify-content:center;transition:background .3s;}
.timer.on{display:flex;}
.timer.prep{background:var(--ink);} .timer.prep *{color:var(--bg);}
.timer.work{background:var(--work);} .timer.work *{color:#fff;}
.timer.rest{background:var(--rest);} .timer.rest *{color:#fff;}
.timer.hold{background:var(--accent);} .timer.hold *{color:#fff;}
.timer.done{background:var(--bg);}
.t-phase{font-size:15px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;opacity:.85;}
.t-count{font-size:128px;font-weight:200;letter-spacing:-4px;line-height:1;margin:6px 0;font-variant-numeric:tabular-nums;}
.t-round{font-size:14px;font-weight:500;opacity:.8;}
.t-name{font-size:18px;font-weight:500;margin-top:8px;text-align:center;padding:0 30px;}
.t-sub{font-size:13px;opacity:.8;margin-top:6px;text-align:center;padding:0 36px;line-height:1.5;max-width:340px;}
.t-ctrl{position:absolute;bottom:calc(var(--safe-bot) + 30px);display:flex;gap:14px;}
.t-btn{background:rgba(255,255,255,0.18);border:1.5px solid rgba(255,255,255,0.5);color:#fff;font-family:var(--font);font-size:14px;font-weight:600;padding:13px 26px;border-radius:30px;cursor:pointer;}
.timer.prep .t-btn,.timer.done .t-btn{border-color:rgba(250,249,246,0.5);}
.t-done-txt{font-size:30px;font-weight:300;color:var(--ink);letter-spacing:-1px;}
.t-done-sub{font-size:14px;color:var(--muted);margin-top:8px;}
.timer.done .t-btn{background:var(--ink);color:var(--bg);border:none;}
</style>
</head>
<body>

<div class="hd">
  <span class="hd-title">Library</span>
  <span class="hd-sub">workouts &amp; programs</span>
  <div class="appsw">
    <a href="index.html" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M4 11l8-6 8 6M6 10v9h12v-9"/></svg></a>
    <a href="tracker.html" aria-label="Lift Log"><svg viewBox="0 0 24 24"><path d="M6.5 7v10M3.5 9v6M17.5 7v10M20.5 9v6M6.5 12h11"/></svg></a>
    <a href="workout-library.html" class="cur" aria-label="Library"><svg viewBox="0 0 24 24"><path d="M5 4h6v16H5zM13 4h6v16h-6"/></svg></a>
    <a href="activity.html" aria-label="Activity"><svg viewBox="0 0 24 24"><path d="M3 12h3.5l2.5 6 4-13 2.5 7H21"/></svg></a>
  </div>
</div>

<div class="viewseg" id="viewseg"></div>
<div class="chips" id="chips"></div>
<div class="list" id="list"></div>

<!-- DETAIL / RUNNER SHEET -->
<div class="sheet" id="sheet">
  <div class="sheet-hd">
    <button class="x" onclick="closeSheet()" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="sheet-title" id="sheet-title"></div>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
  <div class="sheet-foot" id="sheet-foot"></div>
</div>

<!-- TIMER -->
<div class="timer" id="timer">
  <div class="t-phase" id="t-phase"></div>
  <div class="t-count" id="t-count"></div>
  <div class="t-round" id="t-round"></div>
  <div class="t-name" id="t-name"></div>
  <div class="t-sub" id="t-sub"></div>
  <div class="t-ctrl" id="t-ctrl"></div>
</div>

<script src="templates.js"></script>
<script>
const CATS=[['all','All'],['strength','Strength'],['power','Power'],['hiit','Assault Bike'],['grip','Grip'],['adf','ADF'],['warmup','Warm-ups'],['recovery','Recovery']];
let filter='all';
let view='workouts';   // 'workouts' (type=session) | 'programs' (type=program)
const LIFTS_KEY='jvd_lifts', TM_KEY='jvd_tm';
function load(k){try{return JSON.parse(localStorage.getItem(k)||'{}');}catch(e){return{};}}
function save(k,o){try{localStorage.setItem(k,JSON.stringify(o));}catch(e){}}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function round25(n){return Math.round(n/2.5)*2.5;}
function vibe(ms){if(navigator.vibrate)navigator.vibrate(ms);}

// ── render library ──
function renderViewSeg(){
  const cnt=n=>TEMPLATES.filter(t=>n==='programs'?t.type==='program':t.type!=='program').length;
  document.getElementById('viewseg').innerHTML=
    `<button class="${view==='current'?'on':''}" onclick="setView('current')">Current</button>`+
    `<button class="${view==='workouts'?'on':''}" onclick="setView('workouts')">Workouts <span style="opacity:.6">${cnt('workouts')}</span></button>`+
    `<button class="${view==='programs'?'on':''}" onclick="setView('programs')">Programs <span style="opacity:.6">${cnt('programs')}</span></button>`;
}
function setView(v){view=v;filter='all';renderChips();renderList();renderViewSeg();}
function renderChips(){
  const c=document.getElementById('chips');
  if(view!=='workouts'){c.style.display='none';c.innerHTML='';return;}
  c.style.display='flex';
  c.innerHTML=CATS.map(x=>`<button class="chip ${filter===x[0]?'on':''}" onclick="setFilter('${x[0]}')">${x[1]}</button>`).join('');
}
function setFilter(f){filter=f;renderChips();renderList();}
function renderList(){
  if(view==='current'){ return renderCurrent(); }
  const ap=activeProg();
  let items;
  if(view==='programs'){ items=TEMPLATES.filter(t=>t.type==='program'); }
  else { items=TEMPLATES.filter(t=>t.type!=='program'&&(filter==='all'||t.category===filter)); }
  document.getElementById('list').innerHTML=items.map(t=>{
    const badge=(ap&&ap.id===t.id)?'<span class="card-badge cur">● Current</span>':(t.type==='program'?'<span class="card-badge prog">Program</span>':'');
    return `<div class="card" role="button" tabindex="0" onclick="openTemplate('${t.id}')">
      <div class="card-top"><div class="card-name">${t.name}</div>${badge}</div>
      <div class="card-sum">${t.summary}</div>
      <div class="card-meta"><span><b>${t.source}</b></span><span>~${t.duration} min</span></div>
    </div>`;
  }).join('');
}

// ── CURRENT PROGRAM ──
const ACTIVE_KEY='jvd_active_program';
function activeProg(){try{return JSON.parse(localStorage.getItem(ACTIVE_KEY))||null;}catch(e){return null;}}
function setActive(id){
  const cur=activeProg();
  const started=(cur&&cur.id===id&&cur.started)?cur.started:todayISO();
  localStorage.setItem(ACTIVE_KEY,JSON.stringify({id,started}));
  flash('Set as current program');
}
function endActive(){if(!confirm('End your current program? Your logged sessions are kept.'))return;localStorage.removeItem(ACTIVE_KEY);renderViewSeg();renderList();flash('Program ended');}
function setActiveAndShow(id){setActive(id);view='current';renderViewSeg();renderChips();renderList();}
function setActiveFromSheet(id){setActive(id);openTemplate(id);}
function parseISODate(iso){const[y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d);}
function fmtShort(iso){if(!iso)return'';const[y,m,d]=iso.split('-');return +d+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1];}
function weekStartISO(){const d=new Date();const dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);return todayISOfrom(d);}
function todayISOfrom(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function progSessions(id){return (progDone()[id]||[]).slice().sort();}
function progThisWeek(id){const ws=weekStartISO();return progSessions(id).filter(x=>x>=ws).length;}
function weeksRunning(ap){if(!ap||!ap.started)return 0;return Math.floor((new Date()-parseISODate(ap.started))/86400000/7);}
// shared: running banner + set-current button on every program view
function runningBanner(t){
  const ap=activeProg(); if(!ap||ap.id!==t.id) return '';
  const n=progSessions(t.id).length;
  let wktxt='';
  if(t.programType==='progressive'&&t.weeks){const w=Math.min(weeksRunning(ap)+1,t.weeks.length);wktxt=`week ${w} of ${t.weeks.length} · `;}
  else{wktxt=`week ${weeksRunning(ap)+1} · `;}
  return `<div class="run-banner">● Running — ${wktxt}${n} session${n===1?'':'s'} · since ${fmtShort(ap.started)}</div>`;
}
function decorateProgram(t){
  const body=document.getElementById('sheet-body'), foot=document.getElementById('sheet-foot');
  const b=runningBanner(t); if(b) body.innerHTML = b + body.innerHTML;
  const ap=activeProg(); const isCur=ap&&ap.id===t.id;
  const setBtn=`<button class="btn ${isCur?'btn-soft':'btn-pri'}" onclick="setActiveFromSheet('${t.id}')">${isCur?'✓ Current program':'Set as current program'}</button>`;
  foot.innerHTML = setBtn + (foot.innerHTML?'<div style="height:8px"></div>'+foot.innerHTML:'');
}
function logProgSession(id){const all=progDone();if(!all[id])all[id]=[];all[id].push(todayISO());localStorage.setItem(PROG_DONE_KEY,JSON.stringify(all));renderList();flash('Session logged');}
function progReadout(t,n){
  if(t.programType==='challenge'){const sw=t.swingsPerSession?` · ${(n*t.swingsPerSession).toLocaleString()} swings`:'';return `${n} / ${t.target} sessions${sw}`;}
  if(t.programType==='progressive'&&t.weeks){const ap=activeProg();const w=(ap&&ap.id===t.id)?Math.min(weeksRunning(ap)+1,t.weeks.length):1;const wk=t.weeks[w-1];return `Week ${w} of ${t.weeks.length}${wk&&wk.goal?` — ${wk.goal}`:''}`;}
  if(t.programType==='weekly'&&t.days){const d=t.days.length;return `Next up: week ${Math.floor(n/d)+1}, day ${(n%d)+1} of ${d}`;}
  if(t.programType==='easy-strength'){return `${n} of ~40 sessions logged.`;}
  if(t.programType==='531'){return `${n} sessions — bump your training max each completed 4-week cycle.`;}
  return `${n} sessions logged.`;
}
function renderCurrent(){
  const list=document.getElementById('list');
  const ap=activeProg();
  if(!ap||!TEMPLATES.find(t=>t.id===ap.id)){
    list.innerHTML=`<div class="cur-empty">No program running yet.<br>Pick one below — tap <b>Set as current</b> and it'll live here so you can track and resume it.</div>`+
      TEMPLATES.filter(t=>t.type==='program').map(t=>`
        <div class="card">
          <div class="card-top"><div class="card-name">${t.name}</div><span class="card-badge prog">Program</span></div>
          <div class="card-sum">${t.summary}</div>
          <div class="cur-choose"><button class="btn btn-pri" onclick="setActiveAndShow('${t.id}')">Set as current</button><button class="btn btn-soft" onclick="openTemplate('${t.id}')">Preview</button></div>
        </div>`).join('');
    return;
  }
  const t=TEMPLATES.find(x=>x.id===ap.id);
  const dates=progSessions(t.id), n=dates.length;
  const last=n?dates[n-1]:null;
  const wkN=progThisWeek(t.id);
  const daysIn=ap.started?Math.max(0,Math.floor((new Date()-parseISODate(ap.started))/86400000)):0;
  list.innerHTML=`
   <div class="cur-card">
     <div class="cur-badge">● Current program</div>
     <div class="cur-name">${t.name}</div>
     <div class="cur-src">${t.source} · started ${fmtShort(ap.started)}</div>
     <div class="cur-stats">
       <div class="cur-cell"><div class="cur-val">${n}</div><div class="cur-lbl">Sessions</div></div>
       <div class="cur-cell"><div class="cur-val">${wkN}</div><div class="cur-lbl">This week</div></div>
       <div class="cur-cell"><div class="cur-val">${daysIn}</div><div class="cur-lbl">Days in</div></div>
     </div>
     <div class="cur-prog">${progReadout(t,n)}</div>
     <button class="btn btn-pri" onclick="openTemplate('${t.id}')">Open program</button>
     <button class="btn btn-soft" style="margin-top:8px" onclick="logProgSession('${t.id}')">＋ Log a session done${last?` · last ${fmtShort(last)}`:''}</button>
   </div>
   <div class="cur-actions">
     <button class="cur-link" onclick="setView('programs')">Change program</button>
     <button class="cur-link warn" onclick="endActive()">End program</button>
   </div>`;
}
// warm-up block (collapsible) shown before the work in run views
function warmupHTML(t){
  if(!t.warmupRef)return '';
  const w=TEMPLATES.find(x=>x.id===t.warmupRef);
  if(!w||!w.items)return '';
  return `<div class="warm" id="warmblk">
    <div class="warm-hd" onclick="document.getElementById('warmblk').classList.toggle('open')">
      <div class="wt">Warm-up <small>· ${w.name} · ~${w.duration} min</small></div>
      <span class="warm-chev"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span>
    </div>
    <div class="warm-body">${w.items.map(it=>`<div class="wrow"><div><div class="wrow-name">${it.name}</div>${it.note?`<div class="wrow-note">${it.note}</div>`:''}</div>${it.scheme?`<div class="wrow-scheme">${it.scheme}</div>`:''}</div>`).join('')}</div>
  </div>`;
}

// ── detail ──
let runState={};
function openTemplate(id){
  const t=TEMPLATES.find(x=>x.id===id); if(!t)return;
  runState={done:{}};
  document.getElementById('sheet-title').innerHTML=`${t.name}<small>${t.source} · ~${t.duration} min</small>`;
  const body=document.getElementById('sheet-body'); const foot=document.getElementById('sheet-foot');
  const mode = t.run || (t.type==='program'?'program':t.category==='hiit'?'timer':t.category==='recovery'?'holds':'checklist');
  if(mode==='program'){ renderProgram(t,body,foot); }
  else if(mode==='timer'){ renderHiit(t,body,foot); }
  else if(mode==='holds'){ renderRecovery(t,body,foot); }
  else { renderStrength(t,body,foot); }
  if(t.type==='program'){ decorateProgram(t); }
  document.getElementById('sheet').classList.add('on');
}
function closeSheet(){document.getElementById('sheet').classList.remove('on');}

// strength / warmup — checklist
function renderStrength(t,body,foot){
  body.innerHTML=`<div class="note">${t.notes}</div>${warmupHTML(t)}<div class="sec">Movements</div>`+
    t.items.map((it,i)=>itemHTML(it,i)).join('');
  foot.innerHTML='';
}
function itemHTML(it,i){
  const done=runState.done[i];
  return `<div class="item ${done?'done':''}" id="it-${i}">
    <div class="item-row">
      <div class="chk" onclick="toggleItem(${i})"><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 6"/></svg></div>
      <div class="item-main"><div class="item-name">${it.name}</div>${it.note?`<div class="item-note">${it.note}</div>`:''}
        ${it.track?`<button class="logtoggle" onclick="toggleLog(${i},'${(it.ex||it.name).replace(/'/g,"\\'")}')">＋ Log set</button><div id="logbox-${i}"></div>`:''}
      </div>
      ${it.scheme?`<div class="item-scheme">${it.scheme}</div>`:''}
    </div>
  </div>`;
}
function toggleItem(i){runState.done[i]=!runState.done[i];const el=document.getElementById('it-'+i);el.classList.toggle('done');}
function lastWeight(ex){const l=load(LIFTS_KEY)[ex];if(!l||!l.length)return '';const e=l[l.length-1];return (e.weight!==undefined&&e.weight!==0)?e.weight:'';}
function toggleLog(i,ex){
  const box=document.getElementById('logbox-'+i);
  if(box.innerHTML){box.innerHTML='';return;}
  box.innerHTML=`<div class="item-log">
    <input class="mini" id="lw-${i}" type="number" inputmode="decimal" placeholder="kg" value="${lastWeight(ex)}">
    <input class="mini" id="lr-${i}" type="number" inputmode="numeric" placeholder="reps">
    <button class="logbtn" onclick="saveLog(${i},'${ex.replace(/'/g,"\\'")}')">Save</button>
  </div>`;
}
function saveLog(i,ex){
  const w=parseFloat(document.getElementById('lw-'+i).value)||0;
  const r=parseInt(document.getElementById('lr-'+i).value)||0;
  if(!r){flash('Add reps');return;}
  const lifts=load(LIFTS_KEY); if(!lifts[ex])lifts[ex]=[];
  lifts[ex].push({date:todayISO(),weight:w,reps:r,note:''}); save(LIFTS_KEY,lifts);
  document.getElementById('logbox-'+i).innerHTML='';
  runState.done[i]=true; document.getElementById('it-'+i).classList.add('done');
  flash('Logged to Lift Log');
}

// HIIT
function renderHiit(t,body,foot){
  const tm=t.timer;
  body.innerHTML=`<div class="note">${t.notes}</div>${warmupHTML(t)}
    <div class="sec">Protocol</div>
    <div class="item"><div class="item-row"><div class="item-main">
      <div class="item-name">${tm.work}s work · ${tm.rest}s rest · ${tm.rounds} rounds</div>
      ${t.items.map(it=>`<div class="item-note">${it.name} — ${it.note}</div>`).join('')}
    </div></div></div>`;
  foot.innerHTML=`<button class="btn btn-pri" onclick='startHiit(${JSON.stringify(tm)},"${t.name}")'>Start timer</button>`;
}
// Recovery
function renderRecovery(t,body,foot){
  body.innerHTML=`<div class="note">${t.notes}</div><div class="sec">Holds</div>`+
    t.holds.map(h=>`<div class="item"><div class="item-row"><div class="item-main"><div class="item-name">${h.name}</div><div class="item-note">${h.note}</div></div><div class="item-scheme">${h.seconds}s</div></div></div>`).join('');
  foot.innerHTML=`<button class="btn btn-pri" onclick='startHolds(${JSON.stringify(t.holds)},"${t.name}")'>Start holds</button>`;
}

// PROGRAM — dispatch by programType
function renderProgram(t,body,foot){
  if(t.programType==='easy-strength'){ return renderEasyStrength(t,body,foot); }
  if(t.programType==='challenge'){ return renderChallenge(t,body,foot); }
  if(t.programType==='progressive'){ return renderProgressive(t,body,foot); }
  if(t.programType==='weekly'){ return renderWeekly(t,body,foot); }
  runState.lift=runState.lift||t.lifts[0];
  runState.week=runState.week||0;
  const tms=load(TM_KEY); const tm=tms[runState.lift];
  let html=`<div class="note">${t.notes}</div>${warmupHTML(t)}`;
  html+=`<div class="sec">Lift</div><div class="seg">${t.lifts.map(l=>`<button class="${runState.lift===l?'on':''}" onclick="progPick('lift','${l.replace(/'/g,"\\'")}','${t.id}')">${l}</button>`).join('')}</div>`;
  html+=`<div class="sec">Week</div><div class="seg">${t.weeks.map((w,i)=>`<button class="${runState.week===i?'on':''}" onclick="progPick('week',${i},'${t.id}')">${w.label.split('—')[0].trim().replace('Week ','W')}</button>`).join('')}</div>`;
  if(tm===undefined){
    html+=`<div class="tm-warn">No training max set for <b>${runState.lift}</b>. Open Lift Log → Maxes to set one (90% of your est 1RM), then this fills in every working weight automatically.</div>`;
  }else{
    const wk=t.weeks[runState.week];
    html+=`<div class="sec">${wk.label} · TM ${tm}kg</div>`;
    t.warmups.forEach(s=>{ html+=setRowHTML(s,tm,false); });
    wk.sets.forEach((s,i)=>{ const isTop=i===wk.sets.length-1; html+=setRowHTML(s,tm,s.amrap,isTop?runState.lift:null); });
  }
  html+=`<div class="sec" style="margin-top:20px">Accessories</div>`+
    t.accessories.map(a=>`<div class="item"><div class="item-row"><div class="item-main"><div class="item-name">${a.name}</div><div class="item-note">${a.note}</div></div><div class="item-scheme">${a.scheme}</div></div></div>`).join('');
  body.innerHTML=html;
  foot.innerHTML='';
}
function setRowHTML(s,tm,amrap,logEx){
  const wt=round25(tm*s.pct/100);
  return `<div class="setrow ${amrap?'amrap':''}">
    <span class="set-pct">${s.pct}%</span>
    <span class="set-reps">× ${s.reps}${amrap?' <small>(push)</small>':''}${logEx?` <button class="logtoggle" style="margin-top:0;margin-left:6px" onclick="quickLog('${logEx.replace(/'/g,"\\'")}',${wt})">log</button>`:''}</span>
    <span class="set-wt">${wt}<small> kg</small></span>
  </div>`;
}
function progPick(kind,val,id){ runState[kind]=val; const t=TEMPLATES.find(x=>x.id===id); renderProgram(t,document.getElementById('sheet-body'),document.getElementById('sheet-foot')); decorateProgram(t); }
function quickLog(ex,wt){
  const r=parseInt(prompt('Reps completed for '+ex+' @ '+wt+'kg?','5'));
  if(!r)return;
  const lifts=load(LIFTS_KEY); if(!lifts[ex])lifts[ex]=[];
  lifts[ex].push({date:todayISO(),weight:wt,reps:r,note:'5/3/1 top set'}); save(LIFTS_KEY,lifts);
  flash('Logged '+wt+'kg × '+r);
}

// PROGRAM — weekly split (e.g. Easy Strength). Collapsible days + log-set + rules.
function renderWeekly(t,body,foot){
  runState.progName=t.name;
  let html=`<div class="note">${t.notes}</div>${warmupHTML(t)}<div class="sec">The Week</div>`;
  html+=t.days.map((d,di)=>`
    <div class="day${di===0?' open':''}" id="day-${di}">
      <div class="day-hd" onclick="document.getElementById('day-${di}').classList.toggle('open')">
        <div style="flex:1"><div class="day-title">${d.label}</div><div class="day-focus">${d.focus}</div></div>
        <span class="day-dur">${d.dur}</span>
        <span class="day-chev"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span>
      </div>
      <div class="day-body">${d.items.map((it,ii)=>weeklyRow(it,di,ii)).join('')}</div>
    </div>`).join('');
  if(t.rules&&t.rules.length){
    html+=`<div class="sec" style="margin-top:20px">Rules</div>`+
      t.rules.map(r=>`<div class="item"><div class="item-row"><div class="item-main"><div class="item-name">${r.title}</div><div class="item-note">${r.body}</div></div></div></div>`).join('');
  }
  body.innerHTML=html;
  foot.innerHTML='';
}
function weeklyRow(it,di,ii){
  const tag=di+'-'+ii;
  return `<div class="item" id="wk-${tag}" style="border:none;border-bottom:1px solid var(--line);border-radius:0;margin:0">
    <div class="item-row">
      ${it.track?`<div class="chk" onclick="wkTick('${tag}')"><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 6"/></svg></div>`:'<div style="width:24px;flex-shrink:0"></div>'}
      <div class="item-main"><div class="item-name">${it.name}</div>${it.note?`<div class="item-note">${it.note}</div>`:''}
        ${it.track?`<button class="logtoggle" onclick="wkLogToggle('${tag}','${(it.ex||it.name).replace(/'/g,"\\'")}')">＋ Log set</button><div id="wkbox-${tag}"></div>`:''}
      </div>
      ${it.scheme?`<div class="item-scheme">${it.scheme}</div>`:''}
    </div>
  </div>`;
}
function wkTick(tag){document.getElementById('wk-'+tag).classList.toggle('done');}
function wkLogToggle(tag,ex){
  const box=document.getElementById('wkbox-'+tag);
  if(box.innerHTML){box.innerHTML='';return;}
  box.innerHTML=`<div class="item-log">
    <input class="mini" id="wkw-${tag}" type="number" inputmode="decimal" placeholder="kg" value="${lastWeight(ex)}">
    <input class="mini" id="wkr-${tag}" type="number" inputmode="numeric" placeholder="reps">
    <button class="logbtn" onclick="wkSave('${tag}','${ex.replace(/'/g,"\\'")}')">Save</button>
  </div>`;
}
function wkSave(tag,ex){
  const w=parseFloat(document.getElementById('wkw-'+tag).value)||0;
  const r=parseInt(document.getElementById('wkr-'+tag).value)||0;
  if(!r){flash('Add reps');return;}
  const lifts=load(LIFTS_KEY); if(!lifts[ex])lifts[ex]=[];
  lifts[ex].push({date:todayISO(),weight:w,reps:r,note:runState.progName||'Program'}); save(LIFTS_KEY,lifts);
  document.getElementById('wkbox-'+tag).innerHTML='';
  document.getElementById('wk-'+tag).classList.add('done');
  flash('Logged to Lift Log');
}

// PROGRAM — progressive (week-by-week prescription changes, e.g. Mass Made Simple, ABF)
function renderProgressive(t,body,foot){
  runState.progName=t.name;
  const ap=activeProg();
  const autoWk=(ap&&ap.id===t.id)?Math.min(weeksRunning(ap)+1,t.weeks.length):1;
  if(runState.pweek===undefined||runState.pid!==t.id){ runState.pweek=autoWk; runState.pid=t.id; }
  const wi=Math.max(0,Math.min(runState.pweek-1,t.weeks.length-1));
  const wk=t.weeks[wi];
  let html=`<div class="note">${t.notes}</div>${warmupHTML(t)}`;
  html+=`<div class="sec">Week ${(ap&&ap.id===t.id)?'<span style="color:var(--muted);font-weight:400">· you\'re in week '+autoWk+'</span>':''}</div>`;
  html+=`<div class="seg" style="flex-wrap:wrap">`+t.weeks.map((w,i)=>`<button class="${i===wi?'on':''}" onclick="pweekPick(${i+1},'${t.id}')">W${i+1}</button>`).join('')+`</div>`;
  html+=`<div class="sec">${wk.label}${wk.goal?' · '+wk.goal:''}</div>`;
  if(wk.progress){ html+=`<div class="cur-prog">▲ ${wk.progress}</div>`; }
  html+=wk.items.map((it,ii)=>weeklyRow(it,'p',ii)).join('');
  if(t.rules&&t.rules.length){
    html+=`<div class="sec" style="margin-top:20px">Rules</div>`+
      t.rules.map(r=>`<div class="item"><div class="item-row"><div class="item-main"><div class="item-name">${r.title}</div><div class="item-note">${r.body}</div></div></div></div>`).join('');
  }
  body.innerHTML=html; foot.innerHTML='';
}
function pweekPick(w,id){
  runState.pweek=w;
  const t=TEMPLATES.find(x=>x.id===id);
  renderProgressive(t,document.getElementById('sheet-body'),document.getElementById('sheet-foot'));
  decorateProgram(t);
}

// PROGRAM — Easy Strength (adaptable: movement slots + Omnibus presets)
const ES_CFG_KEY='jvd_es_config';
function esConfig(t){
  let c={}; try{c=JSON.parse(localStorage.getItem(ES_CFG_KEY))||{};}catch(e){c={};}
  t.slots.forEach(s=>{ if(!c[s.key]||!s.options.includes(c[s.key])) c[s.key]=s.def; });
  if(!c.preset||!t.presets.some(p=>p.id===c.preset)) c.preset=t.presets[0].id;
  return c;
}
function esSave(t,c){ localStorage.setItem(ES_CFG_KEY,JSON.stringify(c)); }
function renderEasyStrength(t,body,foot){
  runState.progName=t.name;
  const c=esConfig(t);
  const preset=t.presets.find(p=>p.id===c.preset);
  let html=`<div class="note">${t.notes}</div>${warmupHTML(t)}`;
  // preset picker
  html+=`<div class="sec">Template</div><div class="seg" style="flex-wrap:wrap">`+
    t.presets.map(p=>`<button class="${c.preset===p.id?'on':''}" onclick="esPick('preset','${p.id}','${t.id}')">${p.name}</button>`).join('')+`</div>`;
  html+=`<div class="es-note">${preset.note} <b>· ${preset.scheme}</b></div>`;
  // slot pickers (only those used by the preset)
  html+=`<div class="sec">Your Lifts</div>`;
  t.slots.filter(s=>preset.slots.includes(s.key)).forEach(s=>{
    html+=`<div class="es-slot">
      <span class="es-slot-lbl">${s.label}</span>
      <select class="es-sel" onchange="esPick('${s.key}',this.value,'${t.id}')">
        ${s.options.map(o=>`<option ${c[s.key]===o?'selected':''}>${o}</option>`).join('')}
      </select>
    </div>`;
  });
  // today's prescription = chosen lifts at the preset scheme, each loggable
  html+=`<div class="sec" style="margin-top:18px">Today</div>`;
  t.slots.filter(s=>preset.slots.includes(s.key)).forEach((s,i)=>{
    const ex=c[s.key]; const tag='es'+i;
    html+=`<div class="item" id="wk-${tag}" style="border:none;border-bottom:1px solid var(--line);border-radius:0;margin:0">
      <div class="item-row">
        <div class="chk" onclick="wkTick('${tag}')"><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 6"/></svg></div>
        <div class="item-main"><div class="item-name">${ex}</div><div class="item-note">${s.label} · leave 2–3 reps in the tank.</div>
          <button class="logtoggle" onclick="wkLogToggle('${tag}','${ex.replace(/'/g,"\\'")}')">＋ Log set</button><div id="wkbox-${tag}"></div>
        </div>
        <div class="item-scheme">${preset.scheme}</div>
      </div>
    </div>`;
  });
  if(t.rules&&t.rules.length){
    html+=`<div class="sec" style="margin-top:20px">Rules</div>`+
      t.rules.map(r=>`<div class="item"><div class="item-row"><div class="item-main"><div class="item-name">${r.title}</div><div class="item-note">${r.body}</div></div></div></div>`).join('');
  }
  body.innerHTML=html; foot.innerHTML='';
}
function esPick(key,val,id){
  const t=TEMPLATES.find(x=>x.id===id); const c=esConfig(t); c[key]=val; esSave(t,c);
  renderEasyStrength(t,document.getElementById('sheet-body'),document.getElementById('sheet-foot'));
  decorateProgram(t);
}

// PROGRAM — challenge (repeatable workout + progress counter, e.g. 10k swings)
const PROG_DONE_KEY='jvd_prog_done';
function progDone(){ try{return JSON.parse(localStorage.getItem(PROG_DONE_KEY))||{};}catch(e){return{};} }
function renderChallenge(t,body,foot){
  runState.progName=t.name;
  const all=progDone(); const dates=all[t.id]||[];
  const done=dates.length; const pct=Math.min(100,Math.round(done/t.target*100));
  const swDone=t.swingsPerSession?done*t.swingsPerSession:null;
  const swTotal=t.swingsPerSession?t.target*t.swingsPerSession:null;
  let html=`<div class="note">${t.notes}</div>${warmupHTML(t)}`;
  html+=`<div class="chal">
    <div class="chal-top"><span class="chal-big">${done}<small> / ${t.target}</small></span><span class="chal-cap">sessions</span></div>
    <div class="chal-bar"><span style="width:${pct}%"></span></div>
    ${swDone!==null?`<div class="chal-sub">${swDone.toLocaleString()} / ${swTotal.toLocaleString()} swings</div>`:''}
  </div>`;
  html+=`<div class="sec">The Session</div>`+
    t.session.items.map((it,i)=>{
      const tag='ch'+i;
      return `<div class="item" id="wk-${tag}" style="border:none;border-bottom:1px solid var(--line);border-radius:0;margin:0">
        <div class="item-row">
          ${it.track?`<div class="chk" onclick="wkTick('${tag}')"><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 6"/></svg></div>`:'<div style="width:24px;flex-shrink:0"></div>'}
          <div class="item-main"><div class="item-name">${it.name}</div>${it.note?`<div class="item-note">${it.note}</div>`:''}
            ${it.track?`<button class="logtoggle" onclick="wkLogToggle('${tag}','${(it.ex||it.name).replace(/'/g,"\\'")}')">＋ Log set</button><div id="wkbox-${tag}"></div>`:''}
          </div>
          ${it.scheme?`<div class="item-scheme">${it.scheme}</div>`:''}
        </div>
      </div>`;
    }).join('');
  if(t.rules&&t.rules.length){
    html+=`<div class="sec" style="margin-top:20px">Rules</div>`+
      t.rules.map(r=>`<div class="item"><div class="item-row"><div class="item-main"><div class="item-name">${r.title}</div><div class="item-note">${r.body}</div></div></div></div>`).join('');
  }
  body.innerHTML=html;
  foot.innerHTML=`<button class="btn btn-pri" onclick="chalDone('${t.id}')">Log session done</button>`+
    (done?`<button class="btn btn-soft" style="margin-top:8px" onclick="chalUndo('${t.id}')">Undo last session</button>`:'');
}
function chalDone(id){
  const all=progDone(); if(!all[id])all[id]=[]; all[id].push(todayISO());
  localStorage.setItem(PROG_DONE_KEY,JSON.stringify(all));
  const t=TEMPLATES.find(x=>x.id===id);
  renderChallenge(t,document.getElementById('sheet-body'),document.getElementById('sheet-foot'));
  decorateProgram(t);
  flash('Session logged — '+(all[id].length)+' / '+t.target);
}
function chalUndo(id){
  const all=progDone(); if(all[id]&&all[id].length)all[id].pop();
  localStorage.setItem(PROG_DONE_KEY,JSON.stringify(all));
  const t=TEMPLATES.find(x=>x.id===id);
  renderChallenge(t,document.getElementById('sheet-body'),document.getElementById('sheet-foot'));
  decorateProgram(t);
}

// ── TIMER engine ──
let tState=null, tInt=null;
function buildTimer(phases,title){
  tState={phases,idx:0,left:phases[0].dur,title,paused:false};
  document.getElementById('timer').classList.add('on');
  paintTimer(); clearInterval(tInt); tInt=setInterval(tick,1000);
}
function startHiit(tm,name){
  closeSheet();
  const ph=[]; if(tm.prep)ph.push({kind:'prep',label:'Get ready',dur:tm.prep});
  for(let r=1;r<=tm.rounds;r++){
    ph.push({kind:'work',label:'Work',dur:tm.work,round:r,total:tm.rounds});
    if(r<tm.rounds&&tm.rest)ph.push({kind:'rest',label:'Rest',dur:tm.rest,round:r,total:tm.rounds});
  }
  buildTimer(ph,name);
}
function startHolds(holds,name){
  closeSheet();
  const ph=holds.map(h=>({kind:'hold',label:'Hold',dur:h.seconds,name:h.name,sub:h.note}));
  buildTimer(ph,name);
}
function tick(){
  if(tState.paused)return;
  tState.left--;
  if(tState.left<=0){
    vibe(60); tState.idx++;
    if(tState.idx>=tState.phases.length){ return finishTimer(); }
    tState.left=tState.phases[tState.idx].dur;
  }
  paintTimer();
}
function paintTimer(){
  const t=document.getElementById('timer'); const p=tState.phases[tState.idx];
  t.className='timer on '+p.kind;
  document.getElementById('t-phase').textContent=p.label;
  document.getElementById('t-count').textContent=tState.left;
  document.getElementById('t-round').textContent=p.round?`Round ${p.round} / ${p.total}`:(p.kind==='hold'?`${tState.idx+1} / ${tState.phases.length}`:'');
  document.getElementById('t-name').textContent=p.name||'';
  document.getElementById('t-sub').textContent=p.sub||'';
  document.getElementById('t-ctrl').innerHTML=`
    <button class="t-btn" onclick="togglePause(this)">${tState.paused?'Resume':'Pause'}</button>
    <button class="t-btn" onclick="exitTimer()">End</button>`;
}
function togglePause(btn){tState.paused=!tState.paused;btn.textContent=tState.paused?'Resume':'Pause';}
function finishTimer(){
  clearInterval(tInt); vibe([80,60,80]);
  const t=document.getElementById('timer'); t.className='timer on done';
  document.getElementById('t-phase').textContent='';
  document.getElementById('t-count').innerHTML='<span class="t-done-txt">Done</span>';
  document.getElementById('t-round').textContent='';
  document.getElementById('t-name').innerHTML=`<span class="t-done-sub">${tState.title} complete</span>`;
  document.getElementById('t-sub').textContent='';
  document.getElementById('t-ctrl').innerHTML=`<button class="t-btn" onclick="exitTimer()">Close</button>`;
}
function exitTimer(){clearInterval(tInt);document.getElementById('timer').classList.remove('on');tState=null;}

// toast
function flash(m){
  let el=document.getElementById('flash');
  if(!el){el=document.createElement('div');el.id='flash';el.style.cssText='position:fixed;left:50%;bottom:calc(var(--safe-bot) + 30px);transform:translateX(-50%);background:#1c1b18;color:#faf9f6;font-size:12px;font-weight:500;padding:11px 18px;border-radius:22px;z-index:500;transition:opacity .25s;font-family:var(--font);';document.body.appendChild(el);}
  el.textContent=m;el.style.opacity='1';clearTimeout(el._t);el._t=setTimeout(()=>el.style.opacity='0',1500);
}

document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&document.activeElement&&document.activeElement.getAttribute('role')==='button'){e.preventDefault();document.activeElement.click();}
});
view=activeProg()?'current':'workouts';
renderViewSeg();renderChips();renderList();
</script>
